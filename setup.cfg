[metadata]
name = honey-stack
version = 0.1.0
description = Honeytoken per Keystone: rilevamento di credenziali rubate in OpenStack
author = Benedetto Pio Turino
url = https://github.com/BenedettoPio/honey-stack
license = Apache-2.0

[options]
packages = find:
python_requires = >=3.10
install_requires =
    openstacksdk
    oslo.messaging
    oslo.config
    oslo.log
    Flask

[options.packages.find]
include = honeystack*

[options.entry_points]
console_scripts =
    honey-stack = honeystack.manager:cli
    honey-stack-watcher = honeystack.watcher:main
    honey-stack-dashboard = honeystack.app:main
oslo.config.opts =
    honey-stack = honeystack.config:list_opts

[tool:pytest]
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
