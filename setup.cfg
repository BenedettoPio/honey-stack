# ==================================================================
# Configurazione del pacchetto Python di Honey-Stack
# (setup.py chiama solo setuptools.setup(), che legge questo file)
# ==================================================================
 
# Dati descrittivi del pacchetto (nome, versione, autore, licenza)
[metadata]
name = honey-stack
version = 0.1.0
description = Honeytoken per Keystone: rilevamento di credenziali rubate in OpenStack
author = Benedetto Pio Turino
url = https://github.com/BenedettoPio/honey-stack
license = Apache-2.0
 
# Versione minima di Python e librerie che pip installa insieme al pacchetto
[options]
packages = find:
python_requires = >=3.10
install_requires =
    openstacksdk
    oslo.messaging
    oslo.config
    oslo.log
    Flask
 
# Cartelle da includere: honeystack (servizi) e honeystack_dashboard (Horizon)
[options.packages.find]
include = honeystack*
 
# Template HTML dei pannelli di Horizon: non sono file Python,
# senza questa riga non verrebbero installati
[options.package_data]
honeystack_dashboard = */templates/*/*.html
 
# ==================================================================
# Comandi e punti di aggancio
# ==================================================================
 
# I tre comandi (CLI, watcher, API) e le opzioni per oslo-config-generator
[options.entry_points]
console_scripts =
    honey-stack = honeystack.cli:cli
    honey-stack-watcher = honeystack.watcher:main
    honey-stack-dashboard = honeystack.app:main
oslo.config.opts =
    honey-stack = honeystack.config:list_opts
 
# ==================================================================
# Test
# ==================================================================
 
# pytest cerca i test in tests/ e nasconde gli avvisi di deprecazione
[tool:pytest]
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
 
